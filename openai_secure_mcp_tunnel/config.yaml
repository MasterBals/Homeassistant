name: "OpenAI Secure MCP Tunnel"
version: "1.0.0"
slug: "openai_secure_mcp_tunnel"
description: >-
  Verbindet einen lokalen Home-Assistant-MCP-Server über den offiziellen
  OpenAI Secure MCP Tunnel mit ChatGPT, ohne Portfreigabe am Router.
url: "https://github.com/MasterBals/Homeassistant"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
host_network: true
options:
  tunnel_id: ""
  runtime_api_key: ""
  mcp_server_url: "http://127.0.0.1:8765/mcp"
  mcp_bearer_token: ""
  log_level: "info"
schema:
  tunnel_id: str
  runtime_api_key: password
  mcp_server_url: url
  mcp_bearer_token: password
  log_level: "list(debug|info|warn|error)"
