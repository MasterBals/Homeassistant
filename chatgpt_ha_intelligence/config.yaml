name: "ChatGPT Home Assistant Admin + Intelligence"
version: "2.4.0"
slug: "chatgpt_ha_intelligence"
description: >-
  Einheitliche ChatGPT-MCP-App für Home-Assistant-Administration,
  Inventarisierung, persistentes Second Brain, gefiltertes MCP-Protokoll,
  lokale LAN/VLAN-Netzwerkerkennung, den offiziellen OpenAI Secure MCP Tunnel
  und ein abgesichertes Yealink VCM36-W USB/WLAN-Labor.
url: "https://github.com/MasterBals/Homeassistant"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant: "2025.11.0"
homeassistant_api: true
hassio_api: true
hassio_role: homeassistant
host_network: true
usb: true
udev: true
privileged:
  - NET_ADMIN
  - NET_RAW
apparmor: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:brain"
panel_title: "ChatGPT MCP"
map:
  - type: homeassistant_config
    read_only: false
options:
  auto_restart: false
  write_enabled: true
  allow_service_calls: true
  allow_sensitive_files: false
  require_hash_for_writes: true
  max_read_bytes: 2000000
  allowed_cidrs: []
  max_scan_hosts: 1024
  scan_timeout_seconds: 900
  tunnel_id: ""
  runtime_api_key: ""
  log_level: "INFO"
  arlo_voice_enabled: true
  arlo_voice_capture_seconds: 8
  arlo_voice_recording_fallback: true
  yealink_lab_enabled: true
  yealink_ap_write_enabled: false
  yealink_protocol_write_enabled: false
  yealink_wifi_interface: "wlan0"
  yealink_target_wifi_ssid: ""
  yealink_target_wifi_passphrase: ""
  yealink_ap_ssid: "Yealink-Lab"
  yealink_ap_passphrase: ""
  yealink_ap_country: "CH"
  yealink_ap_channel: 6
  yealink_ap_address: "192.168.187.1/24"
  yealink_ap_dhcp_start: "192.168.187.20"
  yealink_ap_dhcp_end: "192.168.187.80"
schema:
  auto_restart: bool
  write_enabled: bool
  allow_service_calls: bool
  allow_sensitive_files: bool
  require_hash_for_writes: bool
  max_read_bytes: int
  allowed_cidrs:
    - str
  max_scan_hosts: "int(1,4096)"
  scan_timeout_seconds: "int(30,3600)"
  tunnel_id: str
  runtime_api_key: password
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
  arlo_voice_enabled: bool
  arlo_voice_capture_seconds: "int(4,20)"
  arlo_voice_recording_fallback: bool
  yealink_lab_enabled: bool
  yealink_ap_write_enabled: bool
  yealink_protocol_write_enabled: bool
  yealink_wifi_interface: str
  yealink_target_wifi_ssid: str
  yealink_target_wifi_passphrase: password
  yealink_ap_ssid: str
  yealink_ap_passphrase: password
  yealink_ap_country: str
  yealink_ap_channel: "int(1,165)"
  yealink_ap_address: str
  yealink_ap_dhcp_start: str
  yealink_ap_dhcp_end: str
