name: Validate
on:
  push:
  pull_request:
jobs:
  mcp-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m compileall chatgpt_ha_intelligence ha_intelligence_bridge
      - run: python chatgpt_ha_intelligence/test_second_brain_history.py
      - run: bash -n chatgpt_ha_intelligence/run_v2.sh

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install ruff black homeassistant
      - run: ruff check custom_components tests
      - run: black --check custom_components tests
      - run: python -m compileall custom_components
