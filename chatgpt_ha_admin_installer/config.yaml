  Veralteter Installer. Bitte stattdessen ChatGPT Home Assistant Admin + Intelligence installieren.
url: "https://github.com/MasterBals/Homeassistant"
arch:
  - amd64
  - aarch64
startup: once
boot: manual
init: false
stage: deprecated
homeassistant: "2025.11.0"
